name: Deploy web app and docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install dependencies
        run: |
          flutter pub get
          python -m pip install -r requirements-docs.txt

      - name: Test app
        run: flutter test

      - name: Build Admincraft web
        run: flutter build web --release --base-href "${{ steps.pages.outputs.base_path }}/"

      - name: Build documentation inside the web app artifact
        run: python -m mkdocs build --strict --site-dir build/web/docs
        env:
          MKDOCS_SITE_URL: "${{ steps.pages.outputs.base_url }}/docs/"

      - name: Keep GitHub Pages from applying Jekyll processing
        run: touch build/web/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
