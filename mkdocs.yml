site_name: Admincraft Docs
site_description: Set up, use, back up, and troubleshoot Admincraft.
site_url: !ENV [MKDOCS_SITE_URL, "http://127.0.0.1:8000/"]
repo_url: https://github.com/joanroig/admincraft
repo_name: joanroig/admincraft
edit_uri: edit/main/docs/
# Keep the repeated footer quiet. Full licensing, trademark, and attribution
# text lives on the About page instead of competing with every article.
copyright: Admincraft · PolyForm Shield 1.0.0

theme:
  name: material
  language: en
  logo: logo/variants/dirt.png
  favicon: logo/variants/dirt.png
  icon:
    repo: fontawesome/brands/github
  palette:
    # Built-in schemes, tinted in stylesheets/extra.css. A custom scheme name
    # inherits Material's light palette for every variable it does not set, so
    # the derived text, code and border colours stayed dark on a dark
    # background and much of the page became unreadable.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Use light mode
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest

nav:
  - Home: index.md
  - Use Admincraft:
      - Install Admincraft: getting-started/install.md
      - Connect your first server: getting-started/first-server.md
      - Interface tour: guides/interface.md
      - Server profiles: guides/server-profiles.md
      - Connection fields: guides/connection-fields.md
      - Connection security: guides/connection-security.md
      - Backup and transfer: guides/backup-transfer.md
      - Google Drive sync: guides/google-drive-sync.md
      - Web app: guides/web-app.md
  - Set up a server:
      - Choose your setup: getting-started/index.md
      - Add to an existing server: getting-started/existing-server.md
      - New Java server with Docker: getting-started/java-server.md
      - Bedrock on Oracle Cloud: server/SERVER_SETUP.md
  - Help & project:
      - Troubleshooting: troubleshooting.md
      - About, license, and trademarks: about.md
  - Development:
      - Developer documentation: development/index.md
      - Build from source: development/building.md
      - Google Drive OAuth for custom builds: development/google-drive-oauth.md
      - Logo and brand assets: logo/LOGO_DESIGN.md
  - Open Admincraft ↗: https://joanroig.github.io/admincraft/

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra:
  # The theme otherwise adds a second "Made with Material for MkDocs" line.
  # Material is credited on the About page instead.
  generator: false
